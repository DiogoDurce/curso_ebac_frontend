<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="justify-content-center align-itens-center d-flex" style="padding:90px;">
    <div class="row" style="width: 30%">
        <div class="col d-flex justify-content-center align-itens-center card p-4 shadow vh-100">
            <h2 class="text-center">Entre em contato</h2>
            <form action="">
                <label class="form-label" for="nome">Seu Nome</label>
                <input class="form-control" type="text" id="nome">
                <label for="email" class="form-label">Seu e-mail:</label>
                <input id="email" type="email" class="form-control">
                <label for="number" class="form-label"></label>Numero de Telefone:</label>
                <input id="numero" type="tel" class="form-control">
                <input type="text" for="mensagem" class="form-label d-none">Sua Mensagem
                <textarea id="mensagem" class="form-control"></textarea>
                <div class="form-check form-switch">
                    <label class="form-check-label" for="aceito-termos">Aceito os termos de uso</label>
                    <input class="form-check-input" type="checkbox" id="aceito-termos">
                </div>
                <button class="btn btn-success">Enviar</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
